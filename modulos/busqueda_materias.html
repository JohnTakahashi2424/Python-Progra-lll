<form id="frmBusquedaMaterias">
    <div class="card text-bg-dark">
        <div class="card-header">
            <div class="d-flex">
                BUSQUEDA DE MATERIAS
                <div class="ms-auto">
                    <button data-form="busqueda_materias" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table class="table table-hover table-dark table-striped text-white">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>CÓDIGO</th>
                        <th>NOMBRE</th>
                        <th>DESCRIPCIÓN</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="tblMaterias"></tbody>
            </table>
        </div>
    </div>
</form>
<script>
    obtenerMaterias();
    async function obtenerMaterias(){
        let response = await fetch("/materias"), 
            respuesta = await response.json();
        mostrarDatosMaterias(respuesta);
    }
    function mostrarDatosMaterias(materias){
        let filas = "";
        materias.forEach(materia=>{
            filas += `
                <tr>
                    <td>${materia.idMateria}</td>
                    <td>${materia.codigo}</td>
                    <td>${materia.nombre}</td>
                    <td>${materia.descripcion}</td>
                    <td><button onClick='eliminarMateria(${materia.idMateria}, event)' class="btn btn-outline-danger btn-sm">ELIMINAR</button></td>
                </tr>
            `;
        });
        document.getElementById("tblMaterias").innerHTML = filas;
    }
    async function eliminarMateria(idMateria, event){
        event.preventDefault();
        if(confirm("¿Seguro que deseas eliminar esta materia?")){
            const respuesta = await fetch(`/eliminar_materia?id=${idMateria}`, { method: "DELETE" });
            const resultado = await respuesta.json();
            alert(resultado.msg === "ok" ? "Materia eliminada" : "Error al eliminar");
            obtenerMaterias();
        }
    }
</script>
