<form id="frmDocentes">
    <div class="card text-bg-dark" style="min-width: 700px;">
        <div class="card-header">Administración de Docentes</div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">Código</div>
                <div class="col-9 col-md-3">
                    <input required type="text" id="txtCodigoDocente" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">Nombre</div>
                <div class="col-9 col-md-4">
                    <input required type="text" id="txtNombreDocente" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">Dirección</div>
                <div class="col-9 col-md-8">
                    <input required type="text" id="txtDireccionDocente" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">Teléfono</div>
                <div class="col-9 col-md-3">
                    <input type="text" id="txtTelefonoDocente" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">Email</div>
                <div class="col-9 col-md-4">
                    <input type="email" id="txtEmailDocente" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">DUI</div>
                <div class="col-9 col-md-3">
                    <input type="text" id="txtDuiDocente" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">Escalafón</div>
                <div class="col-9 col-md-4">
                    <input type="text" id="txtEscalafonDocente" class="form-control form-control-sm" />
                </div>
            </div>
        </div>
        <div class="card-footer text-center">
            <input type="submit" id="btnGuardarDocente" class="btn btn-primary" value="GUARDAR" />
            <input type="reset" id="btnNuevoDocente" class="btn btn-warning" value="NUEVO" />
            <input type="button" id="btnBuscarDocente" class="btn btn-info" value="BUSCAR" />
        </div>
    </div>
</form>

<table id="tablaDocentes" class="table table-striped table-bordered mt-3">
    <thead class="table-dark">
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>DUI</th>
            <th>Escalafón</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
async function guardarDocentes() {
    const datos = {
        codigo: txtCodigoDocente.value,
        nombre: txtNombreDocente.value,
        direccion: txtDireccionDocente.value,
        telefono: txtTelefonoDocente.value,
        email: txtEmailDocente.value,
        dui: txtDuiDocente.value,
        escalafon: txtEscalafonDocente.value
    };
    const respuesta = await fetch("/guardar_docente", {
        method: "POST",
        body: JSON.stringify(datos)
    });
    const resultado = await respuesta.json();
    alert(resultado.msg === "ok" ? "Docente guardado" : "Error al guardar");
    limpiarFormularioDocente();
    obtenerDocentes();
}
function limpiarFormularioDocente(){
    txtCodigoDocente.value = "";
    txtNombreDocente.value = "";
    txtDireccionDocente.value = "";
    txtTelefonoDocente.value = "";
    txtEmailDocente.value = "";
    txtDuiDocente.value = "";
    txtEscalafonDocente.value = "";
}
async function obtenerDocentes() {
    const respuesta = await fetch("/docentes");
    const docentes = await respuesta.json();
    const tbody = document.querySelector("#tablaDocentes tbody");
    tbody.innerHTML = "";
    docentes.forEach(docente => {
        const fila = `<tr>
            <td>${docente.codigo}</td>
            <td>${docente.nombre}</td>
            <td>${docente.direccion}</td>
            <td>${docente.telefono}</td>
            <td>${docente.email}</td>
            <td>${docente.dui}</td>
            <td>${docente.escalafon}</td>
        </tr>`;
        tbody.innerHTML += fila;
    });
}
frmDocentes.addEventListener("submit", async function(e) {
    e.preventDefault();
    await guardarDocentes();
});
document.addEventListener("DOMContentLoaded", obtenerDocentes);
</script>
