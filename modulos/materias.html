<form id="frmMaterias">
    <div class="card text-bg-dark" style="min-width: 700px;">
        <div class="card-header">
            <div class="d-flex">
                ADMINISTRACION DE MATERIAS
                <div class="ms-auto">
                    <button data-form="materias" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">CODIGO</div>
                <div class="col-9 col-md-3">
                    <input required type="text" id="txtCodigoMateria" name="txtCodigoMateria" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-6">
                    <input required type="text" id="txtNombreMateria" name="txtNombreMateria" class="form-control form-control-sm" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">CREDITOS</div>
                <div class="col-9 col-md-2">
                    <input required type="number" id="numCreditosMateria" name="numCreditosMateria" class="form-control form-control-sm" min="0" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">HORAS</div>
                <div class="col-9 col-md-2">
                    <input required type="number" id="numHorasMateria" name="numHorasMateria" class="form-control form-control-sm" min="0" />
                </div>
            </div>
        </div>
        <div class="card-footer text-center">
            <input type="submit" id="btnGuardarMateria" name="btnGuardarMateria" class="btn btn-outline-primary" value="GUARDAR" />
            <input type="reset" id="btnNuevoMateria" name="btnNuevoMateria" class="btn btn-outline-warning" value="NUEVO" />
            <input type="button" id="btnBuscarMateria" name="btnBuscarMateria" class="btn btn-outline-info" value="BUSCAR" />
        </div>
    </div>
</form>
<script>
    var accion = "agregar",
        idMateria = 0;
    
    frmMaterias.addEventListener("submit", e => {
        e.preventDefault();
        guardarMaterias();
    });

    btnNuevoMateria.addEventListener("click", e => {
        limpiarFormulario();
    });

    async function guardarMaterias() {
        let datos = {
            accion: accion,
            idmaterias: idMateria,
            codigo: txtCodigoMateria.value,
            nombre: txtNombreMateria.value,
            creditos: parseInt(numCreditosMateria.value) || 0,
            horas: parseInt(numHorasMateria.value) || 0
        };
        
        console.log("Enviando datos:", datos);
        
        try {
            let response = await fetch("/materias", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos),
            });
            
            let respuesta = await response.json();
            console.log("Respuesta del servidor:", respuesta);
            
            if(respuesta.msg && respuesta.msg.toLowerCase().includes("error")) {
                alertify.error(respuesta.msg);
                return;
            }
            
            alertify.success(respuesta.msg);
            limpiarFormulario();
            
            // Si existe la función obtenerMaterias en busqueda_materias
            if(typeof obtenerMaterias === 'function') {
                obtenerMaterias();
            }
        } catch(error) {
            console.error("Error:", error);
            alertify.error("Error al procesar la solicitud");
        }
    }

    function limpiarFormulario() {
        accion = "agregar";
        idMateria = 0;
        txtCodigoMateria.value = "";
        txtNombreMateria.value = "";
        numCreditosMateria.value = "";
        numHorasMateria.value = "";
        txtCodigoMateria.focus();
    }

    function mostrarMateria(materia) {
        accion = "actualizar";
        idMateria = materia.idmaterias;
        txtCodigoMateria.value = materia.codigo;
        txtNombreMateria.value = materia.nombre;
        numCreditosMateria.value = materia.creditos;
        numHorasMateria.value = materia.horas;
        alertify.success(`Materia ${materia.nombre} cargada para editar`);
    }

    btnBuscarMateria.addEventListener("click", e => {
        e.preventDefault();
        abrirVentana('busqueda_materias');
    });
</script>
